name: Release

# 打 tag 即发版：v1.2.0 / v1.2.0-rc1 都行
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的 tag（重跑用），例如 v1.2.0'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & Publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # 步骤级 if 不能直接读 secrets，这里先落成普通 env
      HAS_GITEE: ${{ secrets.GITEE_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # compileSdk = 36；runner 镜像里不一定预装 platforms;android-36。
      # AGP 能自动下载，但失败时的报错很难读，这里先显式装一遍（已装则是秒过的空操作）。
      - name: Ensure Android SDK 36
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" > /dev/null

      # 签名密钥只以 base64 形式放在 Secrets 里，落地到临时目录后由 build.gradle.kts
      # 的 signingValue() 从环境变量读走；仓库里永远不出现 .jks
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 secrets.KEYSTORE_BASE64，无法产出可安装的正式包"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/muguang-release.jks"
          test -s "$RUNNER_TEMP/muguang-release.jks"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/muguang-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --console=plain

      - name: Verify signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK"
          "$BT/apksigner" verify "$APK" || { echo "::error::APK 未正确签名"; exit 1; }

      - name: Stage artifact
        id: stage
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -1 | cut -d'"' -f2)"
          fi
          OUT="muguang-$VERSION-arm64-v8a.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUT"
          echo "name=$OUT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          sha256sum "$OUT" | tee "$OUT.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 沐光 v${{ steps.stage.outputs.version }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
          generate_release_notes: true
          body: |
            沐光 MUGUANG v${{ steps.stage.outputs.version }}（arm64-v8a，Android 8.0+）

            安装包：`${{ steps.stage.outputs.name }}`

            > 更新检查走 GitHub Releases API；应用内下载优先走 Gitee 镜像，失败自动回落到本页附件。
          files: |
            ${{ steps.stage.outputs.name }}
            ${{ steps.stage.outputs.name }}.sha256

      # Gitee 没有官方 action，直接用 OpenAPI v5 建发行版并传附件。
      # 没配 GITEE_TOKEN 时整步跳过，只发 GitHub 也能用（应用会回落到 GitHub 直链）
      - name: Mirror to Gitee
        if: env.HAS_GITEE == 'true'
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER || 'Ranxian' }}
          GITEE_REPO: ${{ secrets.GITEE_REPO || 'muguang' }}
        run: |
          TAG="${{ github.ref_name }}"
          NAME="沐光 v${{ steps.stage.outputs.version }}"
          OWNER="${GITEE_OWNER:-Ranxian}"
          REPO="${GITEE_REPO:-muguang}"
          BASE="https://gitee.com/api/v5/repos/$OWNER/$REPO/releases"

          BODY=$(printf '沐光 MUGUANG v%s（arm64-v8a，Android 8.0+）\n\n更新检查走 GitHub Releases，下载镜像走本页附件。' "${{ steps.stage.outputs.version }}")

          RESP=$(curl -sS -X POST "$BASE?access_token=$GITEE_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg t "$TAG" --arg n "$NAME" --arg b "$BODY" \
                  '{tag_name:$t,name:$n,body:$b,target_commitish:"main",prerelease:false}')" || true)
          echo "$RESP" | head -c 600

          REL_ID=$(echo "$RESP" | jq -r '.id // empty')
          if [ -z "$REL_ID" ]; then
            echo "::warning::Gitee 建发行版失败（tag 未推送或 token 权限不足），跳过附件上传"
            exit 0
          fi

          curl -sS -X POST \
            "$BASE/$REL_ID/attach_files?access_token=$GITEE_TOKEN" \
            -F "file=@${{ steps.stage.outputs.name }}"
