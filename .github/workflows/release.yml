name: Release

# 打 tag 即发版：v1.1.0 / v1.1.0-rc1 都行
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的 tag（重跑用），例如 v1.1.0'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & Publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # 步骤级 if 不能直接读 secrets，这里先落成普通 env
      HAS_GITEE: ${{ secrets.GITEE_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # compileSdk = 36；runner 镜像里不一定预装 platforms;android-36。
      # AGP 能自动下载，但失败时的报错很难读，这里先显式装一遍（已装则是秒过的空操作）。
      - name: Ensure Android SDK 36
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" > /dev/null

      # 签名密钥只以 base64 形式放在 Secrets 里，落地到临时目录后由 build.gradle.kts
      # 的 signingValue() 从环境变量读走；仓库里永远不出现 .jks
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 secrets.KEYSTORE_BASE64，无法产出可安装的正式包"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/muguang-release.jks"
          test -s "$RUNNER_TEMP/muguang-release.jks"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/muguang-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --console=plain

      - name: Verify signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK"
          "$BT/apksigner" verify "$APK" || { echo "::error::APK 未正确签名"; exit 1; }

      - name: Stage artifact
        id: stage
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -1 | cut -d'"' -f2)"
          fi
          OUT="muguang-$VERSION-arm64-v8a.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUT"
          # 发行说明直接取 CHANGELOG 里对应版本那一节：应用内更新弹窗显示的就是这段，
          # 手写一份放在 workflow 里迟早和 CHANGELOG 对不上。
          {
            echo "沐光 MUGUANG v$VERSION（arm64-v8a，Android 8.0+）"
            echo
            echo "安装包：\`$OUT\`"
            echo
            awk -v ver="$VERSION" \
              '$0 ~ "^## " ver "([^0-9.]|$)" { f=1; next } f && /^## / { exit } f { print }' \
              CHANGELOG.md
            echo
            echo "> 更新检查走 GitHub Releases；应用内下载优先走 Gitee 镜像，失败自动回落到本页附件。"
            echo "> 官方售后群（QQ）：1126843866「沐光事业部」，装不上、用不对都进群说。"
          } > release-notes.md
          echo "name=$OUT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          sha256sum "$OUT" | tee "$OUT.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 沐光 v${{ steps.stage.outputs.version }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
          body_path: release-notes.md
          files: |
            ${{ steps.stage.outputs.name }}
            ${{ steps.stage.outputs.name }}.sha256

      # Gitee 没有官方 action，直接用 OpenAPI v5 建发行版并传附件。
      # 没配 GITEE_TOKEN 时整步跳过，只发 GitHub 也能用（应用会回落到 GitHub 直链）
      - name: Mirror to Gitee
        if: env.HAS_GITEE == 'true'
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER || 'Ranxian' }}
          GITEE_REPO: ${{ secrets.GITEE_REPO || 'muguang' }}
        run: |
          TAG="${{ github.ref_name }}"
          NAME="沐光 v${{ steps.stage.outputs.version }}"
          OWNER="${GITEE_OWNER:-Ranxian}"
          REPO="${GITEE_REPO:-muguang}"
          BASE="https://gitee.com/api/v5/repos/$OWNER/$REPO/releases"
          APK="${{ steps.stage.outputs.name }}"

          # ① 已有同名发行版就复用（重发/重试场景）：以前一律 POST 新建，
          #    发行版已存在时直接失败，附件永远传不上去（v1.1.2 就踩了）
          REL_ID=$(curl -sS "$BASE/tags/$TAG?access_token=$GITEE_TOKEN" | jq -r '.id // empty' || true)
          if [ -z "$REL_ID" ]; then
            # ② 没有才新建；发行说明用与 GitHub 同一份 release-notes.md（CHANGELOG 对应节）
            RESP=$(curl -sS -X POST "$BASE?access_token=$GITEE_TOKEN" \
              -H 'Content-Type: application/json' \
              -d "$(jq -n --arg t "$TAG" --arg n "$NAME" --rawfile b release-notes.md \
                    '{tag_name:$t,name:$n,body:$b,target_commitish:"main",prerelease:false}')" || true)
            echo "$RESP" | head -c 600
            REL_ID=$(echo "$RESP" | jq -r '.id // empty')
          else
            echo "复用已有发行版 id=$REL_ID"
          fi
          if [ -z "$REL_ID" ]; then
            echo "::warning::Gitee 发行版不可用（tag 未推送或 token 权限不足），跳过附件上传"
            exit 0
          fi

          # ③ 已有附件先删（同名的），避免重发后附件堆成两份
          EXISTING=$(curl -sS "$BASE/$REL_ID/attach_files?access_token=$GITEE_TOKEN" | jq -r '.[].name' 2>/dev/null || true)
          for f in "$APK" "$APK.sha256"; do
            if echo "$EXISTING" | grep -qx "$f"; then
              AID=$(curl -sS "$BASE/$REL_ID/attach_files?access_token=$GITEE_TOKEN" \
                | jq -r --arg n "$f" '.[] | select(.name==$n) | .id' 2>/dev/null | head -1)
              [ -n "$AID" ] && curl -sS -X DELETE \
                "$BASE/$REL_ID/attach_files/$AID?access_token=$GITEE_TOKEN" > /dev/null || true
            fi
          done

          # ④ 上传附件并**校验结果**：20MB 上传偶发超时，单次 curl 失败就静默跳过，
          #    Gitee 页面上只剩源码包（v1.1.2 实际表现）。这里带重试并在最后核对附件列表
          for f in "$APK" "$APK.sha256"; do
            ok=0
            for attempt in 1 2 3; do
              echo "上传 $f（第 $attempt 次）"
              if curl -sS --retry 2 --retry-delay 5 --max-time 600 -X POST \
                  "$BASE/$REL_ID/attach_files?access_token=$GITEE_TOKEN" \
                  -F "file=@$f" | grep -q '"name"'; then
                ok=1; break
              fi
              sleep 10
            done
            [ "$ok" = "1" ] || echo "::error::Gitee 附件上传失败：$f"
          done

          FINAL=$(curl -sS "$BASE/$REL_ID/attach_files?access_token=$GITEE_TOKEN" | jq -r '.[].name' 2>/dev/null || true)
          echo "Gitee 附件列表：$FINAL"
          echo "$FINAL" | grep -qx "$APK" || echo "::error::Gitee 缺少 APK 附件"
          echo "$FINAL" | grep -qx "$APK.sha256" || echo "::error::Gitee 缺少校验附件"
